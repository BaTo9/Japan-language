    <script>
function t(key) {
    try {
        var lang = localStorage.getItem('jp-lang') || 'mn';
        return (translations[lang] && translations[lang][key]) || key;
    } catch (e) { return key; }
}
(function() {
    var phrases = [
        { jp: "おはようございます。", romaji: "ohayou gozaimasu", mn: "Өглөөний мэнд." },
        { jp: "こんにちは。", romaji: "konnichiwa", mn: "Сайн байна уу." },
        { jp: "こんばんは。", romaji: "konbanwa", mn: "Оройн мэнд." },
        { jp: "ありがとうございます。", romaji: "arigatou gozaimasu", mn: "Баярлалаа." },
        { jp: "すみません。", romaji: "sumimasen", mn: "Уучлаарай." },
        { jp: "お願いします。", romaji: "onegaishimasu", mn: "Гуйя, туслаач." },
        { jp: "はじめまして。", romaji: "hajimemashite", mn: "Танилцсандаа баяртай байна." },
        { jp: "お元気ですか。", romaji: "ogenki desu ka", mn: "Та сайн байна уу?" },
        { jp: "いくらですか。", romaji: "ikura desu ka", mn: "Энэ ямар үнэтэй вэ?" },
        { jp: "トイレはどこですか。", romaji: "toire wa doko desu ka", mn: "Ариун цэврийн өрөө хаана вэ?" },
        { jp: "駅はどこですか。", romaji: "eki wa doko desu ka", mn: "Өртөө хаана вэ?" },
        { jp: "分かりません。", romaji: "wakarimasen", mn: "Ойлгохгүй байна." },
        { jp: "もう一度お願いします。", romaji: "mou ichido onegaishimasu", mn: "Дахин нэг хэлж өгөөч." },
        { jp: "ゆっくり話してください。", romaji: "yukkuri hanashite kudasai", mn: "Удаан ярьж өгөөч." },
        { jp: "日本語を勉強しています。", romaji: "nihongo wo benkyou shite imasu", mn: "Би япон хэл сурч байна." },
        { jp: "助けてください。", romaji: "tasukete kudasai", mn: "Туслаач!" },
        { jp: "お疲れ様でした。", romaji: "otsukaresama deshita", mn: "Та ядарсан байх. (ажлын дараа)" },
        { jp: "行ってきます。", romaji: "itte kimasu", mn: "Би яваад ирье." }
    ];
    var list = document.getElementById('listeningList');
    var count = document.getElementById('listeningCount');
    if (!list) return;
    if (count) count.textContent = phrases.length;

    function render() {
        list.innerHTML = '';
        phrases.forEach(function(p) {
            var item = document.createElement('div');
            item.className = 'listening-item';
            item.innerHTML = '<div class="listening-player">'
                + '<button class="play-btn" aria-label="play"><i class="fas fa-play"></i></button>'
                + '<div class="listening-info">'
                + '<div class="listening-title">' + p.jp + '</div>'
                + '<div class="listening-text">' + p.romaji + '</div>'
                + '<div class="listening-translation">' + p.mn + '</div>'
                + '<button class="listening-reveal-btn">' + t('listening_reveal') + '</button>'
                + '</div></div>';
            var playBtn = item.querySelector('.play-btn');
            playBtn.addEventListener('click', function() { speak(p.jp, playBtn); });
            var revealBtn = item.querySelector('.listening-reveal-btn');
            var tr = item.querySelector('.listening-translation');
            revealBtn.addEventListener('click', function() {
                var shown = tr.classList.toggle('show');
                revealBtn.textContent = shown ? t('btn_hide') : t('listening_reveal');
            });
            list.appendChild(item);
        });
    }

    function speak(text, btn) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        u.rate = 0.85;
        var icon = btn.querySelector('i');
        btn.classList.add('playing');
        if (icon) icon.className = 'fas fa-volume-up';
        function done() {
            btn.classList.remove('playing');
            if (icon) icon.className = 'fas fa-play';
        }
        u.onend = done;
        u.onerror = done;
        window.speechSynthesis.speak(u);
    }

    document.addEventListener('languageChanged', render);
    render();
})();
    </script>
