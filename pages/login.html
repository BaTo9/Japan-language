                    <label for="regEmail" data-i18n="login_email">Имэйл</label>
                    <input type="email" id="regEmail" autocomplete="email">
                    <label for="regPassword" data-i18n="login_password">Нууц үг</label>
                    <input type="password" id="regPassword" autocomplete="new-password">
                    <p class="auth-msg" id="registerMsg"></p>

    <script src="../script.js"></script>
    <script>
function t(key) {
    try {
        var lang = localStorage.getItem('jp-lang') || 'mn';
        return (translations[lang] && translations[lang][key]) || key;
    } catch (e) { return key; }
}
(function() {
    var loggedBox = document.getElementById('authLoggedBox');
    var formsBox = document.getElementById('authForms');
    var userInfo = document.getElementById('authUserInfo');
    var logoutBtn = document.getElementById('authLogoutBtn');

    function showState() {
        var user = (typeof jpCurrentUser === 'function') ? jpCurrentUser() : null;
        if (user) {
            if (formsBox) formsBox.style.display = 'none';
            if (loggedBox) loggedBox.style.display = 'block';
            if (userInfo) userInfo.textContent = user.name + ' (' + user.email + ')';
        } else {
            if (formsBox) formsBox.style.display = '';
            if (loggedBox) loggedBox.style.display = 'none';
        }
    }
    if (logoutBtn) logoutBtn.addEventListener('click', function() {
        if (typeof jpLogout === 'function') jpLogout();
    });

    function validEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }
    function setMsg(el, key, ok) {
        el.textContent = t(key);
        el.className = 'auth-msg ' + (ok ? 'success' : 'error');
    }

    var signinForm = document.getElementById('signinForm');
    signinForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('signinEmail').value.trim().toLowerCase();
        var pass = document.getElementById('signinPassword').value;
        var msg = document.getElementById('signinMsg');
        if (!email || !pass) { setMsg(msg, 'login_err_empty', false); return; }
        if (!validEmail(email)) { setMsg(msg, 'login_err_email', false); return; }
        var users = jpGetUsers();
        var user = null;
        for (var i = 0; i < users.length; i++) if (users[i].email === email) user = users[i];
        if (!user) { setMsg(msg, 'login_err_notfound', false); return; }
        if (user.passHash !== jpHash(pass)) { setMsg(msg, 'login_err_wrongpass', false); return; }
        localStorage.setItem('jp_session', email);
        setMsg(msg, 'login_success_signin', true);
        setTimeout(function() { window.location.reload(); }, 700);
    });

    var registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var name = document.getElementById('regName').value.trim();
        var email = document.getElementById('regEmail').value.trim().toLowerCase();
        var pass = document.getElementById('regPassword').value;
        var msg = document.getElementById('registerMsg');
        if (!name || !email || !pass) { setMsg(msg, 'login_err_empty', false); return; }
        if (!validEmail(email)) { setMsg(msg, 'login_err_email', false); return; }
        var users = jpGetUsers();
        for (var i = 0; i < users.length; i++) {
            if (users[i].email === email) { setMsg(msg, 'login_err_exists', false); return; }
        }
        users.push({ name: name, email: email, passHash: jpHash(pass) });
        jpSaveUsers(users);
        localStorage.setItem('jp_session', email);
        setMsg(msg, 'login_success_register', true);
        setTimeout(function() { window.location.reload(); }, 700);
    });

    showState();
})();
    </script>
