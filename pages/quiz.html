    <script>
function t(key) {
    try {
        var lang = localStorage.getItem('jp-lang') || 'mn';
        return (translations[lang] && translations[lang][key]) || key;
    } catch (e) { return key; }
}
(function() {
    var counterEl = document.getElementById('quizCounter');
    var scoreEl = document.getElementById('quizScore');
    var questionEl = document.getElementById('questionText');
    var optionsEl = document.getElementById('optionsGrid');
    var feedbackEl = document.getElementById('quizFeedback');
    var nextBtn = document.getElementById('quizNextBtn');
    var boxEl = document.getElementById('quizBox');
    var resultEl = document.getElementById('quizResult');
    var resultStats = document.getElementById('resultStats');
    var resultPercent = document.getElementById('resultPercent');
    var restartBtn = document.getElementById('quizRestartBtn');
    if (!questionEl) return;

    var TOTAL = 10;
    var questions = [];
    var current = 0;
    var score = 0;
    var answered = false;

    function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }
    function pick(arr, n, exclude) {
        return shuffle(arr.filter(function(x) { return x !== exclude; })).slice(0, n);
    }

    function buildQuestions() {
        var pool = [];
        if (typeof hiraganaData !== 'undefined') {
            hiraganaData.slice(0, 46).forEach(function(k) {
                pool.push({ q: k.kana, a: k.romaji, all: hiraganaData.slice(0, 46).map(function(x) { return x.romaji; }) });
            });
        }
        if (typeof katakanaData !== 'undefined') {
            katakanaData.slice(0, 46).forEach(function(k) {
                pool.push({ q: k.kana, a: k.romaji, all: katakanaData.slice(0, 46).map(function(x) { return x.romaji; }) });
            });
        }
        if (typeof kanjiData !== 'undefined') {
            Object.keys(kanjiData).forEach(function(ch) {
                pool.push({ q: ch, a: kanjiData[ch].meaning, all: Object.keys(kanjiData).map(function(x) { return kanjiData[x].meaning; }) });
            });
        }
        if (typeof vocabularyData !== 'undefined') {
            vocabularyData.forEach(function(w) {
                pool.push({ q: w.jp + ' (' + w.reading + ')', a: w.mn, all: vocabularyData.map(function(x) { return x.mn; }) });
            });
        }
        return shuffle(pool).slice(0, TOTAL).map(function(item) {
            var opts = shuffle([item.a].concat(pick(item.all, 3, item.a)));
            return { q: item.q, a: item.a, opts: opts };
        });
    }

    function renderStatus() {
        counterEl.textContent = t('quiz_question') + ' ' + (current + 1) + ' / ' + questions.length;
        scoreEl.textContent = t('quiz_score_label') + ': ' + score;
    }

    function renderQuestion() {
        answered = false;
        var item = questions[current];
        renderStatus();
        questionEl.textContent = item.q;
        feedbackEl.textContent = '';
        nextBtn.disabled = true;
        nextBtn.textContent = (current === questions.length - 1) ? t('quiz_finish') : t('quiz_next');
        optionsEl.innerHTML = '';
        item.opts.forEach(function(opt) {
            var b = document.createElement('button');
            b.className = 'option-btn';
            b.textContent = opt;
            b.addEventListener('click', function() { answer(b, opt); });
            optionsEl.appendChild(b);
        });
    }

    function answer(btn, opt) {
        if (answered) return;
        answered = true;
        var item = questions[current];
        var buttons = optionsEl.querySelectorAll('.option-btn');
        buttons.forEach(function(b) {
            b.disabled = true;
            if (b.textContent === item.a) b.classList.add('correct');
        });
        if (opt === item.a) {
            score++;
            feedbackEl.textContent = t('quiz_correct');
        } else {
            btn.classList.add('wrong');
            feedbackEl.textContent = t('quiz_wrong') + ' — ' + item.a;
        }
        renderStatus();
        nextBtn.disabled = false;
    }

    function finish() {
        boxEl.style.display = 'none';
        resultEl.style.display = 'block';
        var pct = Math.round(score / questions.length * 100);
        resultStats.textContent = score + ' / ' + questions.length;
        resultPercent.textContent = pct + '%';
        var attempts = parseInt(localStorage.getItem('jp_quiz_attempts') || '0', 10) + 1;
        localStorage.setItem('jp_quiz_attempts', String(attempts));
        localStorage.setItem('jp_quiz_last', String(score));
        var best = parseInt(localStorage.getItem('jp_quiz_best') || '0', 10);
        if (score > best) localStorage.setItem('jp_quiz_best', String(score));
    }

    function start() {
        questions = buildQuestions();
        current = 0;
        score = 0;
        boxEl.style.display = 'block';
        resultEl.style.display = 'none';
        renderQuestion();
    }

    nextBtn.addEventListener('click', function() {
        if (current < questions.length - 1) { current++; renderQuestion(); }
        else finish();
    });
    restartBtn.addEventListener('click', start);
    document.addEventListener('languageChanged', function() {
        if (resultEl.style.display === 'none') renderStatus();
        nextBtn.textContent = (current === questions.length - 1) ? t('quiz_finish') : t('quiz_next');
    });
    start();
})();
    </script>
