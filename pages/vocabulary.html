    <script src="../script.js"></script>
    <script src="../vocabulary-data.js"></script>
    <script>
function t(key) {
    try {
        var lang = localStorage.getItem('jp-lang') || 'mn';
        return (translations[lang] && translations[lang][key]) || key;
    } catch (e) { return key; }
}
(function() {
    var table = document.getElementById('vocabTable');
    var empty = document.getElementById('vocabEmpty');
    var count = document.getElementById('vocabCount');
    var search = document.getElementById('vocabSearch');
    if (!table || typeof vocabularyData === 'undefined') return;

    function getFavs() {
        try { return JSON.parse(localStorage.getItem('jp_favorites') || '[]'); } catch (e) { return []; }
    }
    function setFavs(f) { localStorage.setItem('jp_favorites', JSON.stringify(f)); }

    function render() {
        var q = (search.value || '').toLowerCase();
        var favs = getFavs();
        var html = '<div class="vocab-row header"><span data-i18n="vocab_table_japanese">' + t('vocab_table_japanese') + '</span><span>' + t('vocab_table_reading') + '</span><span>' + t('vocab_table_romaji') + '</span><span>' + t('vocab_table_meaning') + '</span><span></span></div>';
        var shown = 0;
        vocabularyData.forEach(function(w) {
            var hay = (w.jp + ' ' + w.reading + ' ' + w.romaji + ' ' + w.mn).toLowerCase();
            if (q && hay.indexOf(q) === -1) return;
            shown++;
            var isFav = favs.indexOf(w.jp) !== -1;
            html += '<div class="vocab-row">'
                + '<span class="jp">' + w.jp + '</span>'
                + '<span>' + w.reading + '</span>'
                + '<span>' + w.romaji + '</span>'
                + '<span>' + w.mn + '</span>'
                + '<button class="vocab-fav-btn' + (isFav ? ' active' : '') + '" data-word="' + w.jp + '" aria-label="favorite"><i class="fas fa-heart"></i></button>'
                + '</div>';
        });
        table.innerHTML = html;
        empty.style.display = shown ? 'none' : 'block';
        count.textContent = shown + ' / ' + vocabularyData.length;
        if (typeof setLanguage === 'function') {
            // header labels are re-applied by script.js on languageChanged; nothing extra needed here
        }
    }

    table.addEventListener('click', function(e) {
        var btn = e.target.closest('.vocab-fav-btn');
        if (!btn) return;
        var word = btn.dataset.word;
        var favs = getFavs();
        var idx = favs.indexOf(word);
        if (idx === -1) favs.push(word); else favs.splice(idx, 1);
        setFavs(favs);
        render();
    });
    search.addEventListener('input', render);
    search.placeholder = t('vocab_search_placeholder');
    document.addEventListener('languageChanged', function() {
        search.placeholder = t('vocab_search_placeholder');
        render();
    });
    render();
})();
    </script>
